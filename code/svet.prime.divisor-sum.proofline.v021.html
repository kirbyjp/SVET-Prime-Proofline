<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>svet.prime.divisor-sum.proofline.v021</title>
    <style>
        body { background: #0a0a0a; color: #eee; font-family: monospace; padding: 20px; line-height: 1.5; }
        h3 { color: #00ffcc; margin-bottom: 5px; }
        .panel { background: #111; border: 1px solid #333; padding: 12px; margin-bottom: 15px; }
        input, select, button { padding: 6px 10px; background: #222; color: #eee; border: 1px solid #444; font-family: monospace; cursor: pointer; }
        button:hover { background: #333; color: #00ffcc; }
        canvas { border: 1px solid #444; background: #111; max-width: 100%; display: block; margin-top: 10px; }
        .stats { margin-top: 15px; font-size: 13px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .regression { margin-top: 10px; font-size: 12px; color: #aaa; }
    </style>
</head>
<body>

    <h3>SVET Engine: Divisor-Sum Proofline Analyzer (v0.21)</h3>
    <p>Phase 1 Formalized Ledger Analysis: Full Structural Interrogation W(n) & Global Landscape Bounding</p>
    
    <div class="panel">
        Range: min <input type="number" id="minInput" value="2" min="2" max="30000" style="width: 70px;"> 
        max <input type="number" id="maxInput" value="15000" min="10" max="30000" style="width: 70px;">
        
        <span style="margin-left: 15px;">Baseline Model:</span>
        <select id="baselineModel">
            <option value="n_ln_n">A·(n ln n) + B·n (Divisor-Sum Harmonic)</option>
            <option value="n_sq">A·n² + B·n</option>
            <option value="n_only">A·n</option>
        </select>

        <button id="runBtn" onclick="runEngine()" style="margin-left: 10px; background: #00ffcc; color: #000; font-weight: bold;">Execute Proofline Run</button>
        <button onclick="stubExportCSV()" style="margin-left: 5px;" title="Hook Ready for Future Export">Export CSV [Hook Ready]</button>
        <span id="spinner" style="margin-left: 10px; display: none; color: #ffcc00;">⚙ Processing Full Interrogation Matrix (O(n²))...</span>
    </div>

    <div style="margin-bottom: 15px; font-size: 13px;">
        <label style="margin-right: 15px;"><input type="checkbox" id="showComposites" checked onchange="redrawCanvas()"> Show Composites / Collapse Valleys (Low Opacity)</label>
        <label style="margin-right: 15px;"><input type="checkbox" id="showTrendline" checked onchange="redrawCanvas()"> Show Baseline Axis (0)</label>
        <label style="margin-right: 15px;"><input type="checkbox" id="showYieldLines" checked onchange="redrawCanvas()"> Show Global Yield Threshold Bounds</label>
        Global Bounding Scale (±σ): <input type="range" id="yieldSlider" min="0.1" max="3.0" step="0.1" value="1.0" oninput="redrawCanvas()" style="vertical-align: middle;">
    </div>

    <!-- Expanded Plot Window -->
    <canvas id="resonanceChart" width="1050" height="550"></canvas>
    
    <div id="stats" class="stats"></div>
    <div id="regressionResults" class="regression"></div>

    <script>
        const canvas = document.getElementById('resonanceChart');
        const ctx = canvas.getContext('2d');
        let masterData = []; // Stores all integer telemetry: {n, isPrime, cost, residual, x1, x2}
        let globalMaxRes = 1;

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGridBasics();
        }

        function drawGridBasics() {
            const w = canvas.width;
            const h = canvas.height;
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(60, h/2); ctx.lineTo(w-20, h/2);
            ctx.stroke();
            
            ctx.fillStyle = '#777';
            ctx.font = '11px monospace';
            ctx.fillText("Integer Range (N)", w/2 - 40, h-10);
            ctx.fillText("Global Residual Variance W(n) - Baseline (Primes & Collapse Valleys)", 10, 20);
        }

        async function runEngine() {
            const min = parseInt(document.getElementById('minInput').value);
            const max = parseInt(document.getElementById('maxInput').value);
            const model = document.getElementById('baselineModel').value;
            const spinner = document.getElementById('spinner');
            const stats = document.getElementById('stats');
            
            spinner.style.display = 'inline';
            await new Promise(r => setTimeout(r, 30));
            clearCanvas();

            masterData = [];
            let S1 = 0, S2 = 0, S3 = 0, T1 = 0, T2 = 0;
            let primeCount = 0;

            // v0.21 Full Structural Interrogation Loop (No early exits -> Divisor Sum Identity W(n))
            for (let n = min; n <= max; n++) {
                let cost = 0;
                let hasExactDivisor = false;

                // Full Interrogation across all d from 2 to n-1
                for (let d = 2; d < n; d++) {
                    cost++; // Divisor attempt ledger entry
                    let sum = 0;
                    if (n % d === 0) hasExactDivisor = true;
                    
                    while (sum < n) {
                        sum += d;
                        cost++; // Additive step ledger entry
                    }
                }

                let isPrime = !hasExactDivisor && n >= 2;
                if (n === 2) isPrime = true; // Edge case safety for 2
                if (isPrime) primeCount++;

                // Build regression variables based on selected model
                let X1 = 0, X2 = 0;
                if (model === 'n_ln_n') {
                    X1 = n * Math.log(n);
                    X2 = n;
                } else if (model === 'n_sq') {
                    X1 = n * n;
                    X2 = n;
                } else if (model === 'n_only') {
                    X1 = n;
                    X2 = 1;
                }

                let Y = cost;
                S1 += X1 * X1; S2 += X1 * X2; S3 += X2 * X2; T1 += Y * X1; T2 += Y * X2;

                masterData.push({ n, isPrime, cost, X1, X2, residual: 0 });

                // Non-blocking asynchronous pacing for browser performance
                if (n % 500 === 0) await new Promise(r => setTimeout(r, 0));
            }

            // Least Squares Matrix Solution [A, B]
            let det = (S1 * S3) - (S2 * S2);
            let A = 1.0, B = 0.0;
            if (Math.abs(det) > 1e-8) {
                A = (T1 * S3 - T2 * S2) / det;
                B = (S1 * T2 - T1 * S2) / det;
            }

            // v0.21 Requirement: globalMaxRes computed across ALL residuals (Primes + Collapse Valleys)
            globalMaxRes = 0;
            masterData.forEach(d => {
                d.residual = d.cost - (A * d.X1 + B * d.X2);
                globalMaxRes = Math.max(globalMaxRes, Math.abs(d.residual));
            });

            document.getElementById('regressionResults').innerHTML = 
                `<strong>Proofline Calibration Parameters:</strong> A = ${A.toFixed(5)}, B = ${B.toFixed(5)} | Model: ${model}`;
            stats.innerHTML = `<strong>Proofline Telemetry:</strong> Full Interrogation of <strong>${masterData.length}</strong> nodes completed. Discovered <strong>${primeCount}</strong> Resonance Isolates.<br>` +
                              `• Global Landscape Peak Residual Deviation: <strong>±${globalMaxRes.toFixed(2)}</strong> Ticks.`;

            redrawCanvas();
            spinner.style.display = 'none';
        }

        function redrawCanvas() {
            if (masterData.length === 0) return;
            
            const w = canvas.width - 80;
            const h = canvas.height - 80;
            const originX = 60;
            const originY = canvas.height / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGridBasics();

            const showComposites = document.getElementById('showComposites').checked;
            const showTrendline = document.getElementById('showTrendline').checked;
            const showYieldLines = document.getElementById('showYieldLines').checked;
            const yieldFactor = parseFloat(document.getElementById('yieldSlider').value);

            // Render Baseline Axis (0)
            if (showTrendline) {
                ctx.strokeStyle = '#ff4444'; ctx.lineWidth = 1.2;
                ctx.setLineDash([4, 4]);
                ctx.beginPath(); ctx.moveTo(originX, originY); ctx.lineTo(originX + w, originY); ctx.stroke();
                ctx.setLineDash([]); 
            }

            // Render Global Adjustable Yield Threshold Bounds
            if (showYieldLines && globalMaxRes > 0) {
                let boundYOffset = ( (globalMaxRes * yieldFactor) / globalMaxRes ) * (h / 2);
                ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 1;
                ctx.setLineDash([2, 2]);
                ctx.beginPath(); ctx.moveTo(originX, originY - boundYOffset); ctx.lineTo(originX + w, originY - boundYOffset); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(originX, originY + boundYOffset); ctx.lineTo(originX + w, originY + boundYOffset); ctx.stroke();
                ctx.setLineDash([]);
            }

            const minN = masterData[0].n;
            const maxN = masterData[masterData.length - 1].n;
            const rangeN = maxN - minN || 1;

            // Render Data Points across the full landscape
            masterData.forEach(d => {
                let x = originX + ((d.n - minN) / rangeN) * w;
                let y = originY - (d.residual / (globalMaxRes || 1)) * (h / 2);
                
                if (y < 10) y = 10;
                if (y > canvas.height - 10) y = canvas.height - 10;

                if (!d.isPrime) {
                    if (showComposites) {
                        ctx.fillStyle = '#444444';
                        ctx.globalAlpha = 0.07; // Ultra-low opacity as specified for collapse valley terrain
                        ctx.fillRect(x, y, 1.2, 1.2);
                        ctx.globalAlpha = 1.0;
                    }
                } else {
                    ctx.fillStyle = '#00ffcc';
                    ctx.globalAlpha = 0.9;
                    ctx.fillRect(x - 1, y - 1, 2.5, 2.5);
                    ctx.globalAlpha = 1.0;
                }
            });
        }

        // CSV-Ready Hook (Stubbed per v0.21 specification, inactive until future export phase)
        function stubExportCSV() {
            if (masterData.length === 0) {
                alert("CSV Hook Ready: Run an execution first to populate masterData telemetry.");
                return;
            }
            console.log("SVET Proofline CSV Hook Triggered: Data structures ready for serialization in future phase.");
            alert(`CSV-Ready Hook Active: ${masterData.length} records verified in memory. Exporter stubbed for future proofline phase.`);
        }

        // Initialize viewport defaults on load
        clearCanvas();
    </script>
</body>
</html>
